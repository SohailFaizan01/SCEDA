
services:
  postgres:
    image: postgres:15
    container_name: sceda_postgres
    environment:
      POSTGRES_USER: eda_user
      POSTGRES_PASSWORD: eda_pass
      POSTGRES_DB: eda_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro

  minio:
    image: minio/minio:latest
    container_name: sceda_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
  
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sceda_backend
    depends_on:
      - postgres
      - minio
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://eda_user:eda_pass@postgres/eda_platform
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=eda-bucket
      - MINIO_REGION=us-east-1
      - RUST_LOG=info
    command: >
      bash -c "
      sqlx migrate run &&
      eda-platform-backend
      "
volumes:
  postgres_data:
  minio_data: